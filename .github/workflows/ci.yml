name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group collectors --group ingest --group mcp --group dev

      - name: COLL-07 import guard
        run: uv run pytest tests/test_import_guard.py -q

      - name: Pytest suite
        run: uv run pytest tests/ -q
