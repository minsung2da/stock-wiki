[project]
name = "stock-wiki"
version = "0.1.0"
description = "Claude-Powered Korean Market Knowledge Base"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13,<3",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "python-dotenv>=1.0",
]

[project.scripts]
stock-mcp = "stock_mcp.__main__:main"
stock = "cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli", "src/collectors", "src/db", "src/ingest", "src/orchestration", "src/shared", "src/stock_mcp"]

[tool.uv]
package = true

[dependency-groups]
collectors = [
    "dart-fss",
    "pykrx>=1.0.50",
    "finance-datareader>=0.9.94",
    "trafilatura>=1.12",
    "feedparser>=6.0",
    "PublicDataReader",
    "fredapi>=0.5",
    "yfinance>=0.2.50",
    "beautifulsoup4>=4.12",
    "requests>=2.32",
    "pandas",
    "lxml",
    "tabulate>=0.9",
    "tenacity>=9.0",
]
ingest = [
    "psycopg[binary]",
    "pgvector",
    "sqlalchemy>=2.0",
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "python-mecab-ko>=1.3,<2",
    "tenacity>=9.0",
]
mcp = [
    "fastmcp>=2.11,<3.0",
    "psycopg[binary]",
    "pgvector",
    "sqlalchemy>=2.0",
]
db = [
    "alembic>=1.18,<2",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
]
dev = [
    "pytest>=9.0",
    "ruff>=0.11.7",
    "pre-commit",
    "mypy",
    "testcontainers[postgres]>=4.8",
    "tiktoken>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "e2e: end-to-end tests requiring a live pipeline (deselect with -m 'not e2e')",
    "db: tests requiring a live Postgres connection",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
